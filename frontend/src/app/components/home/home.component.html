<div class="container">
  <app-loading-spinner></app-loading-spinner>
  
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div class="hero">
    <h1>Word Chain</h1>
    <p class="subtitle">A minimalist real-time vocabulary game.</p>
  </div>

  <div class="game-options">
    <button class="apple-btn primary" (click)="createGameVsComputer()">
      Play vs Computer
    </button>
    <button class="apple-btn secondary" (click)="createGame()">
      Play with Friend
    </button>
  </div>

  <div class="divider-line"><span>or join a game</span></div>

  <div class="join-game-form">
    <div class="input-group">
      <input type="text" [(ngModel)]="gameLink" placeholder="Enter game link or ID" class="apple-input">
      <button class="apple-btn primary join-btn" (click)="joinGame()" [disabled]="!gameLink">
        Join
      </button>
    </div>
  </div>
</div>
